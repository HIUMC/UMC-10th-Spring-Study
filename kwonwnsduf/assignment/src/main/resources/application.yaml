spring:
  application:
    name: assignment

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:umc
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: 18000000