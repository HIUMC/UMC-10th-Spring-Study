spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/김영한 강의록/jpashop
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate :
        # show_sql: true # 시스템 아웃으로 찍힘
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug # 로거로 찍힘
    org.hibernate.orm.jdbc.bind : trace