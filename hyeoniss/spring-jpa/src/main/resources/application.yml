spring:
  application:
    name: jpashop
  datasource:
    url: jdbc:h2:mem:jpashop
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      show_sql: true
      format:sql: true

  logging:
    level:
      org.hibernate.SQL: debug
      org.hibernate.type: trace

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html